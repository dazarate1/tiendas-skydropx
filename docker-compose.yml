services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tiendas
      POSTGRES_USER: tiendas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiendas -d tiendas"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tiendas:${POSTGRES_PASSWORD}@db:5432/tiendas
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?define CREDENTIALS_KEY}
      SESSION_SECRET: ${SESSION_SECRET:?define SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?define ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?define ADMIN_PASSWORD}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:?define NEXT_PUBLIC_ROOT_DOMAIN}
      SKYDROPX_WEBHOOK_SECRET: ${SKYDROPX_WEBHOOK_SECRET:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
